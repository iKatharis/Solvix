<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Widgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monda:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <button id="maximizeBoard" class="corner-btn" title="Maximise whiteboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3H3v6"/>
        <path d="M15 21h6v-6"/>
        <path d="M21 3l-8 8"/>
        <path d="M3 21l8-8"/>
      </svg>
    </button>
  </div>

  <button id="splitBoard" class="corner-btn" title="Split view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M12 4v16"/>
    </svg>
  </button>

  <div class="toolbar">
    <button class="tool active" data-tool="select" title="Select (V)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 3l6.5 15.5 2-6 6-2L5 3z"/>
      </svg>
    </button>
    <button class="tool" data-tool="draw" title="Draw (D)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20l1-4.2L15.3 5.5a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19 4 20z"/>
        <path d="M13.8 7l3.2 3.2"/>
      </svg>
    </button>
    <button class="tool" data-tool="erase" title="Erase (E) — scroll or [ ] to resize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13l-6.5 6.5a2 2 0 0 1-2.8 0L4 14.8a2 2 0 0 1 0-2.8L13 3l7 7-7 7"/>
        <path d="M9 19h9"/>
      </svg>
    </button>
    <button id="clearBoard" title="Clear (X)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 7h14"/>
        <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        <path d="M7 7l1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12"/>
        <path d="M10 11v6M14 11v6"/>
      </svg>
    </button>
  </div>

  <div id="eraserPreview"></div>

  <div class="problem-frame">
    <div class="problem-frame-header">
      <span>Problem Viewer</span>
    </div>
    <div class="problem-frame-footer">
      <select id="cfRating" title="Codeforces rating">
        <option value="800">800</option>
        <option value="900">900</option>
        <option value="1000">1000</option>
        <option value="1100">1100</option>
        <option value="1200" selected>1200</option>
      </select>
      <button id="randomCF" title="Random Codeforces problem at the chosen rating">Codeforces</button>
      <select id="acLetter" title="AtCoder ABC problem letter">
        <option value="C">C</option>
        <option value="D" selected>D</option>
        <option value="E">E</option>
      </select>
      <button id="randomAC" title="Random AtCoder ABC problem with the chosen letter">AtCoder ABC</button>
    </div>
  </div>

  <div id="codeArea">
    <div id="editorContainer"></div>
    <button id="runCode" class="run-btn">&#9654; Run</button>
    <div class="io-panel">
      <div class="io-col">
        <div class="io-label">Input</div>
        <textarea id="stdinBox" placeholder="Program input goes here" spellcheck="false"></textarea>
      </div>
      <div class="io-col">
        <div class="io-label">Output</div>
        <pre id="stdoutBox"></pre>
      </div>
    </div>
  </div>


  <div class="widget">
    <div class="widget-header">
      <h3>Calculator</h3>
      <button onclick="this.closest('.widget').classList.toggle('minimised')">&minus;</button>
    </div>
    <div class="widget-body">
      <div>
        <div class="progress"></div>
        <div class="display">0</div>
        <div class="keys">
          <button class="key fn">C</button>
          <button class="key fn">&plusmn;</button>
          <button class="key fn">%</button>
          <button class="key op">&divide;</button>
          <button class="key">7</button>
          <button class="key">8</button>
          <button class="key">9</button>
          <button class="key op">&times;</button>
          <button class="key">4</button>
          <button class="key">5</button>
          <button class="key">6</button>
          <button class="key op">&minus;</button>
          <button class="key">1</button>
          <button class="key">2</button>
          <button class="key">3</button>
          <button class="key op">+</button>
          <button class="key zero">0</button>
          <button class="key">.</button>
          <button class="key op">=</button>
        </div>
      </div>
    </div>
    <div class="resize-handle"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
